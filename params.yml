# fraction of cases that are assumed to be among msm
msm_fraction: 0.15
# fraction of cases that present with symptoms
sti_symptoms:
  gc:
    male: 0.9
    female: 0.5
  chlamydia:
    male: 0.5
    female: 0.3
  syphilis:
    male: 0.67
    female: 0.5
  trichomoniasis:
    # doesn't matter since no male hiv cases are attributable to trichomoniasis
    male: 0.5
    female: 0.5
# fraction of symptomatic cases that are treated
# we allow the numbers to vary both by STI and sex because presumably
# some STIs lead to worse symptoms and thus higher treatment rates, and also
# because there may be differences in care-seeking behavior by sex
sti_treatment:
  gc:
    male: 0.71
    female: 0.661
  chlamydia:
    male: 0.71
    female: 0.661
  syphilis:
    male: 0.71
    female: 0.661
  trichomoniasis:
    # doesn't matter
    male: 0.71
    female: 0.661
